version: '3'

includes:
  install-prerequisites: Taskfile_{{OS}}.yaml
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  example-playwright:
    taskfile: ./example/playwright/Taskfile.yaml
    dir: ./example/playwright
  clipboard:
    taskfile: ./.taskfiles/go.yaml
    dir: ./cmds/clipboard
  extension-installer:
    taskfile: ./.taskfiles/go.yaml
    dir: ./cmds/extension-installer
  backend:
    taskfile: ./.taskfiles/go.yaml
    dir: ./backend
  operator:
    taskfile: ./operator/Taskfile.yaml
    dir: ./operator

vars:
  GO_PROJECTS: clipboard extension-installer operator backend
tasks:
  all:fmt:
    cmds:
      - for: { var: GO_PROJECTS }
        task: "{{.ITEM}}:fmt"
  all:lint:
    cmds:
      - for: { var: GO_PROJECTS }
        task: "{{.ITEM}}:lint"
  all:test:
    cmds:
      - for: { var: GO_PROJECTS }
        task: "{{.ITEM}}:test"


  install-prerequisites:
    desc: Install prerequisites (docker, kubectl, kustomize, skaffold)


  skaffold:dev:
    desc: Start the local development environment with port forwarding
    preconditions:
      - sh: command -v skaffold
        msg: Skaffold is required but it's not installed. Aborting.
    cmds:
      - skaffold dev {{.CLI_ARGS}}

  skaffold:run-remote:
    desc: Run deployment to the dev stand
    preconditions:
      - sh: command -v skaffold
        msg: Skaffold is required but it's not installed. Aborting.
    cmds:
      - skaffold run -p=remote-dev

  skaffold:deploy-remote:
    desc: Run deployment to the dev stand
    env:
      AWS_DEFAULT_PROFILE: EPAM
    requires:
      vars: [TAG]
    cmds:
      - skaffold deploy -p remote-dev,rp-beta -t {{.TAG}}

  rustfs:install:
    desc: "Installs RustFS (S3-compatible) Helm chart for development"
    cmds:
      - helm repo add rustfs https://charts.rustfs.com/ --force-update
      - |
        helm install rustfs rustfs/rustfs -n browserkube --create-namespace \
          --set ingress.enabled=true \
          --set ingress.className=nginx \
          --set "ingress.hosts[0].host=rustfs.docker.internal" \
          --set "ingress.hosts[0].paths[0].path=/" \
          --set "ingress.hosts[0].paths[0].pathType=Prefix" \
          --set mode.standalone.enabled=true \
          --set mode.distributed.enabled=false \
          --set storageclass.name=hostpath
  rustfs:get-pass:
    desc: "Prints RUSTFS_SECRET_KEY from rustfs-secret"
    cmd: kubectl get secret --namespace browserkube rustfs-secret -o jsonpath="{.data.RUSTFS_SECRET_KEY}" | base64 -d

  rustfs:init:
    vars:
      ACCESS_KEY:
        sh: kubectl get secret --namespace browserkube rustfs-secret -o jsonpath="{.data.RUSTFS_ACCESS_KEY}" | base64 -d
      SECRET_KEY:
        sh: kubectl get secret --namespace browserkube rustfs-secret -o jsonpath="{.data.RUSTFS_SECRET_KEY}" | base64 -d
    cmds:
      - |
        kubectl run rustfs-mc-init \
          --namespace browserkube \
          --rm --tty -i --restart='Never' \
          --env MINIO_ACCESS_KEY_ID={{.ACCESS_KEY}} \
          --env MINIO_SECRET_ACCESS_KEY={{.SECRET_KEY}} \
          --image quay.io/minio/mc:latest \
          --command -- /bin/sh -c "mc alias set rustfs http://rustfs-svc.browserkube.svc.cluster.local:9000 \$MINIO_ACCESS_KEY_ID \$MINIO_SECRET_ACCESS_KEY && mc mb --ignore-existing rustfs/browserkube && mc mb --ignore-existing rustfs/browserkube-archive"

