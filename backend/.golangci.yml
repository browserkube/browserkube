version: '2'

run:
  timeout: 10m
  tests: false
  go: '1.26'


formatters:
  settings:
    tagalign:
      align-tags: true
      sort-tags: true
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes: github.com/browserkube/browserkube
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/browserkube/browserkube)

linters:
  settings:
    govet:
      enable:
        - shadow
    cyclop:
      max-complexity: 14
    dupl:
      threshold: 500
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    lll:
      line-length: 160
    depguard:
      rules:
        # deny for all go files
        AllGoFiles:
          files:
            - $all
          deny:
            - pkg: go.opencensus.io
              desc: "do not use OpenCensus; use OpenTelemetry instead"
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
      disabled-checks:
        - wrapperFunc
        - commentFormatting
        - yodaStyleExpr
        - unnamedResult
        - commentedOutCode
        - assignOp
        - docStub
        - whyNoLint

  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - dupl
    - durationcheck
    - errcheck
    - goconst
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - tagalign
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace

  disable:
    - gochecknoglobals
    - wsl
    - funlen
    - err113
    - godot
    - nestif
    - nlreturn
    - exhaustive
    - godox
    - varnamelen
    - ireturn
    - gocritic
    - exhaustruct
    - gomoddirectives
    - wrapcheck
    - mnd
    - inamedparam
    - perfsprint
    - contextcheck
    - canonicalheader
    - intrange
    - recvcheck
