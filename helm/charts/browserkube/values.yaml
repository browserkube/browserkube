browsers:
  namespace: browserkube
  serviceName: sessions
  nodeSelector:
env: dev
name: browserkube
pullPolicy: IfNotPresent
blob:
  rustfs:
    enabled: true
    secretName: rustfs-secret
  url: "s3://browserkube?hostname_immutable=true&endpoint=http://rustfs-svc.browserkube.svc.cluster.local:9000&use_path_style=true&region=us-east-1&disable_https=true"
  aws:
    enabled: false
    accessKeyID:
    accessKeySecret:
  archive:
    url: "s3://browserkube-archive?endpoint=http://rustfs-svc.browserkube.svc.cluster.local:9000&use_path_style=true&region=us-east-1&disable_https=true"
healthcheck:
  enabled: true
  port: 4444
  periodSeconds: 3
  initialDelaySeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
resources:
  enabled: true
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi
ingress:
  class: nginx
  enabled: true
  hosts:
    - kubernetes.docker.internal
#  tls:
#    - hosts:
#        - kubernetes.docker.internal
#      secretName: browserkube-tls
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/x-forwarded-prefix: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 128m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 512k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: 512k
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2000"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1000"
  tlsAnnotations:
#    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    #cert-manager.io/acme-challenge-type: http01
    #cert-manager.io/cluster-issuer: "letsencrypt-prod"

sidecar:
  port: 9999
  repository: quay.io/browserkube/browserkube-sidecar
  tag: ""
ui:
  port: 8080
  repository: quay.io/browserkube/browserkube-ui
  tag: ""
operator:
  repository: quay.io/browserkube/browser-operator
  tag: ""
  runAsNonRoot: true
  runAsUser:
  runAsGroup:
backend:
  repository: quay.io/browserkube/browserkube
  tag: ""
  volumes:
    sessionResult:
      sizeLimit: 100Mi
      storageClassName: hostpath
recorder:
  repository: quay.io/browserkube/recorder
  tag: ""
extensionInstaller:
  repository: quay.io/browserkube/extension-installer
  tag: ""
browserUpdater:
  enabled: false
  repository: quay.io/browserkube/browser-updater
  tag: ""
sessionArchiver:
  enabled: true
  repository: quay.io/browserkube/session-archiver
  tag: ""
xServer:
  repository: quay.io/browserkube/x-server
  tag: ""
vncServer:
  repository: quay.io/browserkube/vnc-server
  tag: ""
clipboard:
  repository: quay.io/browserkube/clipboard
  tag: ""

rbac:
  create: true
  serviceAccount:
    create: true
    serviceAccountName: browserkube
openshift:
  enabled: false
  backendHost: backend.apps.cluster.com

telemetry:
  prometheus_enabled: "\'true\'"
  version: v1.0.0
  providerEnabled: "\'false\'"

grafana:
  enabled: false
  adminPassword: password
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
      nginx.ingress.kubernetes.io/use-regex: "true"
    path: /grafana/?(.*)
    pathType: ImplementationSpecific
    hosts:
      - kubernetes.docker.internal
  grafana.ini:
    server:
      root_url: http://localhost:3000/grafana
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://{{ .Release.Name }}-tempo:3100
          isDefault: true
          jsonData:
            httpMethod: GET
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://{{ .Release.Name }}-prometheus-server:80
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
          jsonData:
            httpMethod: GET

tempo:
  enabled: false
  tempo:
    receivers:
      zipkin:
        endpoint: "0.0.0.0:9411"
    metricsGenerator:
      enabled: true

prometheus:
  enabled: false
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

rustfs:
  name: rustfs
  enabled: false
  ingress:
    tls: true
    enabled: true
    hostname: rustfs.docker.internal
    ingressClassName: nginx

cronJobContext:
  contextTimeout: 30s
