version: '2'

run:
  timeout: 5m
  go: '1.26'

formatters:
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes: github.com/browserkube/browserkube/operator
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/browserkube/browserkube/operator)

issues:
  # don't skip warning about doc comments
  # don't exclude the default set of lint
  exclude-use-default: false
  # restore some of the defaults
  # (fill in the rest as needed)
  exclude-rules:
    - path: "api/*"
      linters:
        - lll
    - path: "internal/*"
      linters:
        - dupl
        - lll
linters:
  enable:
    - dupl
    - errcheck
    - copyloopvar
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - tagalign
    - unconvert
    - unparam
    - unused
